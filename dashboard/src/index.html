<!DOCTYPE html>
<html lang="ms" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#0b1221"/>
  <title>KIK — Sistem Sasaran Menembak</title>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg"/>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>

<header class="appbar">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#05121c" stroke-width="2.4">
        <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="#05121c"/>
      </svg>
    </div>
    <div>
      <div class="title" data-i="app_title">Sistem Sasaran Menembak</div>
      <div class="subtitle" data-i="app_subtitle">KIK — Papan Pemuka Langsung</div>
    </div>
  </div>
  <div class="spacer"></div>
  <div id="top-timer" class="timer">00:00.0</div>
  <div style="display:flex;align-items:center;gap:6px;font-size:12px;padding:0 6px;color:var(--text-dim)">
    <span id="conn-dot" class="status-dot offline"></span>
    <span id="conn-label" data-i="disconnected">Disconnected</span>
  </div>
  <button id="btn-lang" class="icon-btn lang-pill" title="Language"><span id="lang-label">MS</span></button>
  <button id="btn-theme" class="icon-btn" title="Theme">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
  </button>
</header>

<nav class="tabs" id="tabs"></nav>

<main>
  <section id="view-live"     class="view active"></section>
  <section id="view-score"    class="view"></section>
  <section id="view-health"   class="view"></section>
  <section id="view-session"  class="view"></section>
  <section id="view-history"  class="view"></section>
  <section id="view-settings" class="view"></section>
</main>

<script src="/js/i18n.js"></script>
<script src="/js/ws.js"></script>
<script src="/js/app.js"></script>
<script>
  // Keep language pill label in sync
  const syncLang = () => {
    const el = document.getElementById('lang-label');
    if(el) el.textContent = (window.KIK_LANG||'ms').toUpperCase();
  };
  window.addEventListener('langchange', syncLang);
  document.addEventListener('DOMContentLoaded', syncLang);
</script>
</body>
</html>
