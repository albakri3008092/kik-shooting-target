name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  firmware:
    name: Compile firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/bin" sh
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
      - name: Install libraries
        run: |
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "AsyncTCP"
          arduino-cli lib install "ESPAsyncWebServer"
      - name: Compile target_node
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/target_node
      - name: Compile central_receiver
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/central_receiver
      - name: Compile get_mac
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/get_mac

  dashboard:
    name: Lint & syntax-check dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Syntax check JS files
        run: |
          for f in dashboard/src/js/*.js dashboard/src/sw.js simulator/server.js; do
            echo "--> $f"; node --check "$f";
          done
      - name: Validate HTML files exist
        run: |
          test -f dashboard/src/index.html
          test -f dashboard/src/tv.html
          test -f dashboard/src/instructor.html
          test -f dashboard/src/manifest.webmanifest
      - name: Install simulator deps
        run: cd simulator && npm install --no-audit --no-fund
      - name: Start simulator and smoke test
        run: |
          cd simulator
          node server.js &
          SERVER_PID=$!
          sleep 2
          curl -fsS http://localhost:8080/ > /dev/null
          curl -fsS http://localhost:8080/api/status | head -c 200
          echo
          kill $SERVER_PID
