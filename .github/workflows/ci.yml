name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # Full v2 firmware uses ESPAsyncWebServer (me-no-dev) which only compiles
  # on ESP32 Arduino core 2.x. Keep a dedicated job pinned to 2.0.17 until
  # we migrate to the maintained ESP32Async fork.
  firmware-v2:
    name: Compile full v2 firmware (esp32 2.0.17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/bin" sh
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Install ESP32 core 2.0.17
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32@2.0.17 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
      - name: Install libraries
        run: |
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "AsyncTCP"
          arduino-cli lib install "ESPAsyncWebServer"
      - name: Compile target_node
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/target_node
      - name: Compile central_receiver
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/central_receiver
      - name: Compile get_mac
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/get_mac

  # The simple demo sketches only use built-in WebServer.h, so we verify
  # they compile on BOTH core 2.x (legacy) and 3.x (what the Arduino IDE
  # Boards Manager now offers by default).
  demo-firmware:
    name: Compile demo sketches (esp32 ${{ matrix.core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ['2.0.17', '3.1.3', '3.3.0']
    steps:
      - uses: actions/checkout@v4
      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/bin" sh
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Install ESP32 core ${{ matrix.core }}
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32@${{ matrix.core }} --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
      - name: Compile demo/target_demo
        run: arduino-cli compile --fqbn esp32:esp32:esp32 demo/target_demo
      - name: Compile demo/central_demo
        run: arduino-cli compile --fqbn esp32:esp32:esp32 demo/central_demo
      - name: Compile prototype_v2/target_v2
        run: arduino-cli compile --fqbn esp32:esp32:esp32 prototype_v2/target_v2
      - name: Compile prototype_v2/central_v2
        run: arduino-cli compile --fqbn esp32:esp32:esp32 prototype_v2/central_v2
      - name: Compile prototype_v3/target_v3
        run: arduino-cli compile --fqbn esp32:esp32:esp32 prototype_v3/target_v3
      - name: Compile prototype_v3/central_v3
        run: arduino-cli compile --fqbn esp32:esp32:esp32 prototype_v3/central_v3

  demo:
    name: Smoke-test demo dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Syntax check demo simulator
        run: node --check demo/simulator.js
      - name: Start demo preview and smoke test
        run: |
          node demo/simulator.js &
          PID=$!
          sleep 2
          curl -fsS http://localhost:8081/ > /dev/null
          curl -fsS http://localhost:8081/status | head -c 200
          echo
          kill $PID

  dashboard:
    name: Lint & syntax-check dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Syntax check JS files
        run: |
          for f in dashboard/src/js/*.js dashboard/src/sw.js simulator/server.js; do
            echo "--> $f"; node --check "$f";
          done
      - name: Validate HTML files exist
        run: |
          test -f dashboard/src/index.html
          test -f dashboard/src/tv.html
          test -f dashboard/src/instructor.html
          test -f dashboard/src/manifest.webmanifest
      - name: Install simulator deps
        run: cd simulator && npm install --no-audit --no-fund
      - name: Start simulator and smoke test
        run: |
          cd simulator
          node server.js &
          SERVER_PID=$!
          sleep 2
          curl -fsS http://localhost:8080/ > /dev/null
          curl -fsS http://localhost:8080/api/status | head -c 200
          echo
          kill $SERVER_PID
